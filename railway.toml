# JARVIS TRADER — Railway Configuration
# ─────────────────────────────────────────────────────────────────────────────

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
buildCommand = ""

# Root directory is the repo root — Dockerfile at root copies engine/ in

[deploy]
startCommand = ""           # Dockerfile CMD handles this
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
