allowBuilds:
  sharp: true
  unrs-resolver: true
# pnpm 10.16+ moved per-project settings here (the package.json "pnpm" field
# is no longer read). Allow native build scripts (sharp image pipeline +
# unrs-resolver) so `pnpm install` does not fail with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
