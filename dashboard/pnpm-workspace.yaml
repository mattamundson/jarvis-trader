allowBuilds:
  sharp: true
  unrs-resolver: true
# pnpm 10.16+ moved per-project settings here (the package.json "pnpm" field
# is no longer read by pnpm 11). Approve native build scripts so `pnpm install`
# does not fail with ERR_PNPM_IGNORED_BUILDS in CI and so pnpm 11's
# verify-deps-before-run pre-script install succeeds.
# allowBuilds (pnpm >=11.22 boolean map) supersedes onlyBuiltDependencies;
# both are kept so pnpm 10.x and 11.x agree.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
