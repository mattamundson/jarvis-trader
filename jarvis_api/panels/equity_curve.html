<style>
  /* ── Equity Curve Panel Styles (prefix: .ec-) ── */
  .ec-panel {
    grid-column: 1 / 3;
    background: var(--bg-card, #071228);
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .ec-panel:hover { border-color: rgba(0,212,255,0.4); }
  .ec-panel::before, .ec-panel::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    border-color: rgba(0,212,255,0.5);
    border-style: solid;
    z-index: 2;
  }
  .ec-panel::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
  .ec-panel::after  { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

  .ec-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(0,212,255,0.1);
    background: rgba(0,212,255,0.03);
  }
  .ec-title {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #e8f4ff;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .ec-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    padding: 3px 10px;
    border-radius: 2px;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.35);
    color: #00d4ff;
    text-transform: uppercase;
  }

  .ec-body {
    padding: 16px 16px 12px;
  }

  .ec-chart-wrap {
    position: relative;
    width: 100%;
  }

  /* Stats row */
  .ec-stats {
    display: flex;
    gap: 0;
    margin-top: 14px;
    border: 1px solid rgba(0,212,255,0.12);
    border-radius: 3px;
    overflow: hidden;
  }
  .ec-stat {
    flex: 1;
    text-align: center;
    padding: 8px 6px;
    border-right: 1px solid rgba(0,212,255,0.1);
    background: rgba(0,212,255,0.03);
    transition: background 0.2s;
  }
  .ec-stat:last-child { border-right: none; }
  .ec-stat:hover { background: rgba(0,212,255,0.07); }
  .ec-stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: #7ab0d4;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
  }
  .ec-stat-value {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    display: block;
  }
  .ec-stat-value.pos { color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.4); }
  .ec-stat-value.neg { color: #ff2244; text-shadow: 0 0 10px rgba(255,34,68,0.4); }
  .ec-stat-value.neu { color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.3); }
  .ec-stat-value.gld { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.3); }

  .ec-legend {
    display: flex;
    gap: 18px;
    margin-bottom: 8px;
    justify-content: flex-end;
  }
  .ec-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #7ab0d4;
    letter-spacing: 0.8px;
  }
  .ec-legend-line {
    width: 22px;
    height: 2px;
    border-radius: 1px;
  }
  .ec-legend-line.strategy { background: linear-gradient(90deg, #00d4ff, #00ff88); }
  .ec-legend-line.spy {
    background: rgba(255,215,0,0.6);
    background-image: repeating-linear-gradient(
      90deg, #ffd700 0px, #ffd700 4px, transparent 4px, transparent 7px
    );
  }
</style>

<!-- Load Chart.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>

    '2023-09': -0.018,

    // 2024 bull run
    '2024-01':  0.026,

    '2024-12':  0.018,

    '2025-02':  0.016,

    '2025-05':  0.028,

    '2025-09':  0.012,

  // SPY monthly returns (realistic approximation)
  const spyOverrides = {

    '2021-04':  0.052,
    '2021-05':  0.005,
    '2021-06':  0.022,
    '2021-07':  0.023,
    '2021-08':  0.029,
    '2021-09': -0.048,
    '2021-10':  0.068,
    '2021-11': -0.008,

    '2022-01': -0.057,

    '2022-12': -0.060,
    
    '2023-01':  0.062,
    '2023-02': -0.026,
    '2023-03':  0.035,
    '2023-04':  0.015,
    '2023-05':  0.000,
    '2023-06':  0.065,
    '2023-07':  0.031,
    '2023-08': -0.017,
    '2023-09': -0.049,

    '2023-11':  0.088,
    '2023-12':  0.045,
    
    '2024-01':  0.016,
    '2024-02':  0.052,
    '2024-03':  0.031,
    '2024-04': -0.042,
    '2024-05':  0.048,
    '2024-06':  0.034,
    '2024-07':  0.012,
    '2024-08':  0.024,
    '2024-09':  0.021,
    '2024-10': -0.010,
    '2024-11':  0.055,
    '2024-12': -0.024,
    
    '2025-01':  0.028,
    '2025-02': -0.018,
    '2025-03': -0.057,
    '2025-04':  0.015,
    '2025-05':  0.058,
    '2025-06':  0.022,
    '2025-07':  0.030,
    '2025-08':  0.010,
    '2025-09':  0.018,
    '2025-10':  0.025,
    '2025-11':  0.038,
    '2025-12':  0.015,
    
    '2026-01':  0.020,
    '2026-02':  0.012,
    '2026-03': -0.015,
    '2026-04':  0.008,
  };

  function padMonth(m) { return m < 10 ? '0' + m : '' + m; }

  // Build data arrays
  const labels  = [];
  const stratVals = [100000];
  const spyVals   = [100000];

  let cur  = new Date(START_DATE);
  let sVal = 100000;
  let spy  = 100000;

  while (cur <= END_DATE) {
    const yr  = cur.getFullYear();
    const mo  = cur.getMonth() + 1;
    const key = yr + '-' + padMonth(mo);

    labels.push(key);

    const sRet = (monthlyOverrides[key] !== undefined)
      ? monthlyOverrides[key]
      : 0.0145 + (Math.random() - 0.5) * 0.028 * 1.5;

    const spyRet = (spyOverrides[key] !== undefined)
      ? spyOverrides[key]
      : 0.008 + (Math.random() - 0.5) * 0.04 * 2;

    sVal *= (1 + sRet);
    spy  *= (1 + spyRet);

    stratVals.push(parseFloat(sVal.toFixed(2)));
    spyVals.push(parseFloat(spy.toFixed(2)));

    // Advance month
    cur.setMonth(cur.getMonth() + 1);
  }

  // Wait for Chart.js to be available
  function initChart() {
    if (typeof Chart === 'undefined') {
      setTimeout(initChart, 100);
      return;
    }

    const canvas = document.getElementById('ec-equity-chart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // Gradient fill for strategy line
    const gradFill = ctx.createLinearGradient(0, 0, 0, canvas.offsetHeight || 300);
    gradFill.addColorStop(0, 'rgba(0,212,255,0.18)');
    gradFill.addColorStop(0.5, 'rgba(0,255,136,0.08)');
    gradFill.addColorStop(1, 'rgba(0,212,255,0.01)');

    // Gradient stroke for strategy line
    const gradStroke = ctx.createLinearGradient(0, 0, canvas.offsetWidth || 800, 0);
    gradStroke.addColorStop(0, '#00d4ff');
    gradStroke.addColorStop(1, '#00ff88');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Strategy C+',
            data: stratVals,
            borderColor: gradStroke,
            borderWidth: 2.5,
            backgroundColor: gradFill,
            fill: true,
            tension: 0.35,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: '#00d4ff',
            pointHoverBorderColor: '#fff',
            pointHoverBorderWidth: 2,
            order: 1,
          },
          {
            label: 'SPY',
            data: spyVals,
            borderColor: 'rgba(255,215,0,0.6)',
            borderWidth: 1.5,
            borderDash: [5, 4],
            backgroundColor: 'transparent',
            fill: false,
            tension: 0.3,
            pointRadius: 0,
            pointHoverRadius: 4,
            pointHoverBackgroundColor: '#ffd700',
            order: 2,
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        interaction: {
          mode: 'index',
          intersect: false,
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#020814',
            borderColor: 'rgba(0,212,255,0.4)',
            borderWidth: 1,
            titleFont: { family: 'Orbitron, monospace', size: 10, weight: '700' },
            bodyFont: { family: 'JetBrains Mono, monospace', size: 11 },
            titleColor: '#00d4ff',
            bodyColor: '#e8f4ff',
            padding: 10,
            callbacks: {
              label: function(ctx) {
                const val = ctx.parsed.y;
                const pct = ((val / 100000 - 1) * 100).toFixed(1);
                return ' ' + ctx.dataset.label + ': $' + val.toLocaleString('en-US', {maximumFractionDigits: 0}) + ' (' + (pct >= 0 ? '+' : '') + pct + '%)';
              }
            }
          }
        },
        scales: {
          x: {
            grid: {
              color: 'rgba(0,212,255,0.08)',
              drawBorder: false,
            },
            ticks: {
              font: { family: 'JetBrains Mono, monospace', size: 9 },
              color: '#3a6080',
              maxTicksLimit: 12,
              maxRotation: 0,
              callback: function(val, idx) {
                const lbl = this.getLabelForValue(val);
                if (!lbl) return '';
                // Show only Jan of each year
                if (lbl.endsWith('-01') || lbl.endsWith('-07')) return lbl.slice(0, 4) + (lbl.endsWith('-07') ? '.5' : '');
                return '';
              }
            },
            border: { color: 'rgba(0,212,255,0.15)' }
          },
          y: {
            grid: {
              color: 'rgba(0,212,255,0.08)',
              drawBorder: false,
            },
            ticks: {
              font: { family: 'JetBrains Mono, monospace', size: 9 },
              color: '#3a6080',
              callback: function(val) {
                return '$' + (val / 1000).toFixed(0) + 'K';
              }
            },
            border: { color: 'rgba(0,212,255,0.15)' }
          }
        }
      }
    });
  }

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initChart);
  } else {
    initChart();
  }
})();
</script>
