<div class="panel">
  <!-- HEADER -->
  <div class="panel-header">
    <div class="header-dot"></div>
    <span class="panel-title">INTELLIGENCE FEED</span>
    <span class="unread-badge" id="unreadBadge">8</span>
    <div class="header-actions">
      <button class="mark-read-btn" onclick="markAllRead()">MARK ALL READ</button>
      <span class="header-time" id="headerTime">--:--:--</span>
    </div>
  </div>

  <!-- SEARCH + FILTERS -->
  <div class="search-bar">
    <input class="search-input" type="text" placeholder="Search alerts…" id="searchInput" oninput="applyFilters()">
  </div>
  <div class="filter-chips" id="filterChips" style="margin-bottom:10px;">
    <div class="filter-chip signal active" data-type="signal" onclick="toggleFilter(this)">SIGNAL</div>
    <div class="filter-chip ok active" data-type="ok" onclick="toggleFilter(this)">OK</div>
    <div class="filter-chip warn active" data-type="warn" onclick="toggleFilter(this)">WARN</div>
    <div class="filter-chip error active" data-type="error" onclick="toggleFilter(this)">ERROR</div>
    <div class="filter-chip info active" data-type="info" onclick="toggleFilter(this)">INFO</div>
  </div>

  <!-- FEED -->
  <div class="feed-container" id="feedContainer">
    <div class="empty-state" id="emptyState">No alerts match your filters</div>
  </div>

  <!-- WHATSAPP NOTE -->
  <div class="whatsapp-note">
    <span class="wa-icon">📲</span>
    <div class="wa-text">
      <strong>WHATSAPP ALERTS WIRED</strong> — Push notifications active via
      <span class="wa-code">engine/alerts/whatsapp.py</span>
      · All SIGNAL and WARN events auto-forwarded
    </div>
  </div>
</div>

<script>
const API_URL = 'http://localhost:8020/api/alerts';
const POLL_INTERVAL = 15000;

const TYPE_ICONS = {
  signal: '◈', ok: '✓', warn: '⚠', error: '✕', info: '·'
};

const INITIAL_ALERTS = [
  { id: 1, time: '16:05:21', type: 'signal', msg: 'Strategy C+ weekly signal generated — Scale 60.9% RISK_ON', unread: true },
  { id: 2, time: '08:54:01', type: 'ok',     msg: 'IBKR dry-run PASSED — DUP662235 paper account', unread: true },
  { id: 3, time: '08:52:44', type: 'signal', msg: 'Holdings computed: XLK 30.5% / QQQ 30.5% / SHY 39.1%', unread: true },
  { id: 4, time: '08:51:00', type: 'info',   msg: 'Macro tailwind detected — yield curve +0.699% → scale ×1.10', unread: true },
  { id: 5, time: '08:49:22', type: 'info',   msg: 'CoT: ES -115,762 NEUTRAL | NQ +10,821 NEUTRAL', unread: true },
  { id: 6, time: '08:47:11', type: 'warn',   msg: 'SPY 04/23 715C expires TOMORROW — review position', unread: true },
  { id: 7, time: '08:46:00', type: 'ok',     msg: 'Paper validation Day 2/30 — all systems nominal', unread: true },
  { id: 8, time: '04/21 16:05', type: 'signal', msg: 'Previous signal: Scale 58.2% RISK_ON (prior week)', unread: true },
];

let alerts = [...INITIAL_ALERTS];
let nextId = 100;
let activeFilters = new Set(['signal','ok','warn','error','info']);

function countUnread() {
  return alerts.filter(a => a.unread).length;
}

function updateUnreadBadge() {
  const count = countUnread();
  const badge = document.getElementById('unreadBadge');
  badge.textContent = count;
  badge.className = 'unread-badge' + (count === 0 ? ' zero' : '');
}

function markAllRead() {
  alerts.forEach(a => a.unread = false);
  updateUnreadBadge();
  renderFeed();
}

function toggleFilter(el) {
  const type = el.dataset.type;
  if (activeFilters.has(type)) {
    activeFilters.delete(type);
    el.classList.remove('active');
    el.classList.add('inactive');
  } else {
    activeFilters.add(type);
    el.classList.add('active');
    el.classList.remove('inactive');
  }
  applyFilters();
}

function applyFilters() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const visible = alerts.filter(a => {
    if (!activeFilters.has(a.type)) return false;
    if (query && !a.msg.toLowerCase().includes(query) && !a.time.includes(query)) return false;
    return true;
  });
  renderFeed(visible);
}

function renderFeed(items) {
  const data = items || alerts;
  const container = document.getElementById('feedContainer');
  const empty = document.getElementById('emptyState');

  // Remove old items
  const existing = container.querySelectorAll('.alert-item');
  existing.forEach(e => e.remove());

  if (data.length === 0) {
    empty.classList.add('visible');
    return;
  }
  empty.classList.remove('visible');

  data.forEach((a, idx) => {
    const div = document.createElement('div');
    div.className = `alert-item ${a.type}${a.unread ? ' unread' : ''}${a.isNew ? ' new-anim' : ''}`;
    div.dataset.id = a.id;
    div.innerHTML = `
      <div class="alert-left">
        <div class="alert-type-icon ${a.type}">${TYPE_ICONS[a.type] || '·'}</div>
      </div>
      <div class="alert-body">
        <div class="alert-header-row">
          <span class="alert-type-label ${a.type}">${a.type.toUpperCase()}</span>
          <span class="alert-time-label">${a.time}</span>
        </div>
        <div class="alert-msg">${a.msg}</div>
      </div>
    `;
    div.addEventListener('click', () => {
      const target = alerts.find(x => x.id === a.id);
      if (target) target.unread = false;
      div.classList.remove('unread');
      updateUnreadBadge();
    });
    container.appendChild(div);
  });
}

function addAlert(alert) {
  alert.id = nextId++;
  alert.isNew = true;
  alerts.unshift(alert);
  // Clear isNew after animation
  setTimeout(() => { alert.isNew = false; }, 500);
  applyFilters();
  updateUnreadBadge();
}

// Poll API
async function pollAlerts() {
  try {
    const res = await fetch(API_URL, { signal: AbortSignal.timeout(6000) });
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (data && data.alerts && Array.isArray(data.alerts)) {
      data.alerts.forEach(a => {
        if (!alerts.find(x => x.msg === a.msg && x.time === a.time)) {
          addAlert({ ...a, unread: true });
        }
      });
    }
  } catch { /* use static */ }
}

function updateClock() {
  document.getElementById('headerTime').textContent =
    new Date().toLocaleTimeString('en-US', { hour12: false });
}

// Init
renderFeed();
updateUnreadBadge();
updateClock();
setInterval(updateClock, 1000);
setInterval(() => { pollAlerts(); }, POLL_INTERVAL);
pollAlerts();
</script>
