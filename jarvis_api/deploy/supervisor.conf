[supervisord]
logfile=/home/user/workspace/jarvis_api/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/home/user/workspace/jarvis_api/jarvis_api.pid
nodaemon=false
silent=false

[supervisorctl]
serverurl=unix:///home/user/workspace/jarvis_api/supervisor.sock

[unix_http_server]
file=/home/user/workspace/jarvis_api/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:jarvis_api]
command=/usr/local/bin/python3 -m uvicorn main:app --host 0.0.0.0 --port 8020 --workers 1
directory=/home/user/workspace/jarvis_api
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=10
stdout_logfile=/home/user/workspace/jarvis_api/logs/jarvis_api.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stderr_logfile=/home/user/workspace/jarvis_api/logs/jarvis_api_err.log
stderr_logfile_maxbytes=5MB
environment=PYTHONUNBUFFERED="1"
