name: Strategy C+ Signal Monitor

# Runs every 6 hours. Posts to Discord on anomaly or healthy status.
# Accumulates a rolling signal_history.json in the repo output directory.
# Transitions from bootstrap baseline → live history once 10+ weeks accumulate.
on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # manual trigger for immediate test

jobs:
  signal-health-check:
    name: Strategy C+ Signal Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needed to commit updated signal_history.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run signal monitor
        id: monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 engine/strategy_c/signal_monitor.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true  # let the commit step always run

      - name: Commit updated signal_history.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(monitor): update signal_history.json [skip ci]"
          file_pattern: "engine/strategy_c/output/signal_history.json"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Fail the run if monitor flagged anomaly
        if: steps.monitor.outputs.exit_code != '0'
        run: |
          echo "Signal monitor returned exit code ${{ steps.monitor.outputs.exit_code }}"
          echo "Discord alert was sent. Review signal before Monday MOO."
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Signal Monitor Run" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Exit code:** ${{ steps.monitor.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.monitor.outputs.exit_code }}" == "0" ]]; then
            echo "**Status:** ✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠️ Anomaly detected — Discord alert sent" >> $GITHUB_STEP_SUMMARY
          fi
