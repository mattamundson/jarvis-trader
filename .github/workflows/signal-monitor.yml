name: Strategy C+ Signal Monitor

# NOTE: GitHub only runs `schedule:` triggers from the DEFAULT branch (master).
# This file does nothing on deploy/dashboard — it must land on master.
#
#   generate   Fri 21:30 UTC  (after 4pm ET close year-round) → fresh signal, committed
#   check      every 6h       → Discord only when the issue set changes
#   premarket  Mon 00:00 UTC  (Sun 7pm CDT / 6pm CST)  → always-post pre-open gate
on:
  schedule:
    - cron: '30 21 * * 5'
    - cron: '0 */6 * * *'
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'generate | check | premarket'
        default: 'premarket'

concurrency:
  group: strategy-c-signal
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then M="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "30 21 * * 5" ]]; then M=generate
          elif [[ "${{ github.event.schedule }}" == "0 0 * * 1" ]]; then M=premarket
          else M=check; fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"; echo "mode=$M"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal deps
        if: steps.mode.outputs.mode == 'generate'
        run: pip install -q pandas numpy scipy yfinance requests matplotlib

      - name: Generate live signal
        if: steps.mode.outputs.mode == 'generate'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m engine.strategy_c.live_signal

      - name: Run monitor
        id: run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set +e
          M="${{ steps.mode.outputs.mode }}"; [[ "$M" == "generate" ]] && M=check
          python engine/strategy_c/signal_monitor.py --mode "$M"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Persist signal + history + state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(strategy-c): ${{ steps.mode.outputs.mode }} ${{ github.run_id }} [skip ci]"
          file_pattern: >-
            engine/strategy_c/output/strategy_c_plus_live_signal.json
            engine/strategy_c/output/signal_history.json
            engine/strategy_c/output/monitor_state.json

      - name: Mark run red on critical
        if: steps.run.outputs.exit_code == '2'
        run: exit 1
