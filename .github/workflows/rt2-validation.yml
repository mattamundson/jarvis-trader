name: RT2 Focused Validation

on:
  push:
    branches:
      - feature/trade-intent-paper-api

permissions:
  contents: read

jobs:
  focused-rt2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: |
          pip install -q -r engine/requirements-core.txt
          pip install -q ruff==0.8.0

      - name: Ruff RT-2 changed Python only
        run: |
          cd engine
          ruff check \
            trade_intents/core.py \
            trade_intents/store.py \
            routers/trade_intents_router.py \
            routers/orders_router.py \
            tests/test_trade_intent_core.py \
            tests/test_trade_intent_store.py \
            tests/test_trade_intents_router.py \
            --config ruff.toml

      - name: Byte-compile RT-2 modules
        run: |
          python -m py_compile \
            engine/trade_intents/core.py \
            engine/trade_intents/store.py \
            engine/routers/trade_intents_router.py \
            engine/routers/orders_router.py

      - name: Run RT-2 focused pytest
        run: |
          pytest \
            engine/tests/test_trade_intent_core.py \
            engine/tests/test_trade_intent_store.py \
            engine/tests/test_trade_intents_router.py \
            -v --tb=short
