name: Safety Invariant Check

# Gates any PR that touches safety-critical engine configuration unless the
# author has explicitly tagged the PR body with [safety-review] AND the live
# values of the documented safety invariants (PRB-15) still match the pinned
# expectations in engine/scripts/check_safety_invariants.py. The [safety-review]
# tag alone only proves someone claimed to review the change; the value check
# below actually diffs the numbers, so a silent/unauthorized bump (like the
# max_contracts=2->20 drift the tag-only gate missed) fails CI outright instead
# of just relying on the tag-adder to have caught it by eye. This is a
# tripwire, not a substitute for human review.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: safety-invariant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-gate:
    name: Safety-critical config gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert live safety-invariant values (PRB-15)
        # Stdlib-only, imports/executes no engine code -- safe to run against
        # an untrusted PR head. Runs on every PR regardless of which files
        # changed, since a drift could theoretically reach engine/config.py's
        # live values without tripping the file-pattern detector below (e.g.
        # a generated/templated config write). See the script's own docstring
        # for exactly what it does and does not cover.
        run: python engine/scripts/check_safety_invariants.py

      - name: Detect changes to safety-critical files
        id: detect
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # Safety-critical surface: config.py (hard limits), kill switch,
          # risk manager, position sizer math.
          PATTERNS='^engine/config\.py$|^engine/risk/|^engine/notifications/openclaw_notifier\.py$|^engine/agents/trader\.py$'
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | (grep -E "$PATTERNS" || true))
          if [[ -n "$CHANGED" ]]; then
            echo "touches_safety=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$CHANGED"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "touches_safety=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require [safety-review] tag in PR body
        if: steps.detect.outputs.touches_safety == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          echo "Safety-critical files changed:"
          echo "${{ steps.detect.outputs.files }}"
          if [[ "${PR_BODY:-}" != *"[safety-review]"* ]]; then
            echo ""
            echo "ERROR: This PR modifies safety-critical engine files but the PR body"
            echo "       does not contain the '[safety-review]' tag."
            echo ""
            echo "       Add '[safety-review]' to the PR description to acknowledge that a"
            echo "       human has reviewed the change against documented invariants:"
            echo "         - Position size bounds (default max_contracts=2, hard cap=20 -- see"
            echo "           engine/scripts/check_safety_invariants.py for the full pinned list,"
            echo "           which the 'Assert live safety-invariant values' step above already"
            echo "           checked against the live values, not just this PR's stated intent)"
            echo "         - Kill switch activation / deactivation paths"
            echo "         - Stop-loss direction (long: stop below entry; short: stop above)"
            echo "         - Hardcoded capital / drawdown caps in engine/config.py"
            exit 1
          fi
          echo "OK: [safety-review] tag present."

      - name: No safety files touched
        if: steps.detect.outputs.touches_safety == 'false'
        run: echo "No safety-critical files modified in this PR."
