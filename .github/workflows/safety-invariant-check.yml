name: Safety Invariant Check

# Gates any PR that touches a safety-critical runtime, broker-mutation,
# authorization, readiness, operator-status, or governing-policy surface unless
# the author has explicitly tagged the PR body with [safety-review] AND the live
# values of the documented safety invariants (PRB-15) still match the pinned
# expectations in engine/scripts/check_safety_invariants.py. The [safety-review]
# tag alone only proves someone claimed to review the change; the value check
# below actually diffs the numbers, so a silent/unauthorized bump (like the
# max_contracts=2->20 drift the tag-only gate missed) fails CI outright instead
# of just relying on the tag-adder to have caught it by eye. This is a
# tripwire, not a substitute for human review.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: safety-invariant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-gate:
    name: Safety-critical config gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert live safety-invariant values (PRB-15)
        # Stdlib-only, imports/executes no engine code -- safe to run against
        # an untrusted PR head. Runs on every PR regardless of which files
        # changed, since a drift could theoretically reach engine/config.py's
        # live values without tripping the file-pattern detector below (e.g.
        # a generated/templated config write). See the script's own docstring
        # for exactly what it does and does not cover.
        run: python engine/scripts/check_safety_invariants.py

      - name: Detect changes to safety-critical files
        id: detect
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # Safety-critical surface: hard limits and risk, execution and broker
          # mutation, authorization/readiness, operator-facing safety truth,
          # safety evidence scripts, and the policies that govern those paths.
          PATTERNS='^engine/config\.py$|^engine/risk/|^engine/execution/|^engine/approval/|^engine/domain/(contracts|instruments)\.py$|^engine/routers/(trade_intents|approval_queue|health|phase3_readiness)_router\.py$|^engine/main\.py$|^engine/notifications/openclaw_notifier\.py$|^engine/agents/trader\.py$|^dashboard/lib/(controlPlane|runtimeSnapshot)\.ts$|^dashboard/app/(command-center-v2|mission-control)/|^scripts/(phase0_runtime_truth_snapshot|assess_phase0_runtime_snapshot|check_phase0_isg0|refresh_phase0_runtime_snapshot|install_phase0_runtime_snapshot_task)\.(py|ps1)$|^docs/plans/JARVIS_MASTER_IMPLEMENTATION_PLAN_v1\.0\.md$|^docs/plans/phase0/|^CLAUDE\.md$|^engine/CLAUDE\.md$|^\.claude/rules/safety\.md$|^\.github/workflows/(safety-invariant-check|pr-governance)\.yml$|^scripts/local-pr-gate\.ps1$'
          # Three-dot (merge-base) diff, not two-dot: two-dot compares BASE's
          # tip directly against HEAD, so it picks up every file the base
          # branch has drifted on since this PR forked, not just what this PR
          # itself changed. On a fast-moving base that false-positives on
          # nearly every PR (see PR #532, 2026-07-31).
          #
          # Inspect both old and new paths for renames so a safety file cannot
          # leave the protected surface merely by being renamed first.
          CHANGED_PATHS=$(
            git diff --name-status -M "$BASE"..."$HEAD" |
              awk 'BEGIN { FS="\t" } $1 ~ /^R/ { print $2; print $3; next } { print $2 }'
          )
          CHANGED=$(printf '%s\n' "$CHANGED_PATHS" | (grep -E "$PATTERNS" || true) | sort -u)
          if [[ -n "$CHANGED" ]]; then
            echo "touches_safety=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$CHANGED"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "touches_safety=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require [safety-review] tag in PR body
        if: steps.detect.outputs.touches_safety == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          echo "Safety-critical files changed:"
          echo "${{ steps.detect.outputs.files }}"
          if [[ "${PR_BODY:-}" != *"[safety-review]"* ]]; then
            echo ""
            echo "ERROR: This PR modifies safety-critical engine files but the PR body"
            echo "       does not contain the '[safety-review]' tag."
            echo ""
            echo "       Add '[safety-review]' to the PR description to acknowledge that a"
            echo "       human has reviewed the change against documented invariants:"
            echo "         - Position size bounds (default max_contracts=2, hard cap=20 -- see"
            echo "           engine/scripts/check_safety_invariants.py for the full pinned list,"
            echo "           which the 'Assert live safety-invariant values' step above already"
            echo "           checked against the live values, not just this PR's stated intent)"
            echo "         - Kill switch activation / deactivation paths"
            echo "         - Stop-loss direction (long: stop below entry; short: stop above)"
            echo "         - Hardcoded capital / drawdown caps in engine/config.py"
            exit 1
          fi
          echo "OK: [safety-review] tag present."

      - name: No safety files touched
        if: steps.detect.outputs.touches_safety == 'false'
        run: echo "No safety-critical files modified in this PR."
