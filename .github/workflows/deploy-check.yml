name: JARVIS TRADER Pre-Deploy Verification
on:
  push:
    branches: [main, master]

concurrency:
  group: jarvis-deploy-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-deploy-check:
    name: Pre-Deploy Verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1

      # See .github/actions/free-disk-space/action.yml for why this runs before
      # setup-python restores the pip cache. The pre-deploy job installs the same
      # disk-heavy engine/requirements-core.txt stack as CI; without this cleanup,
      # the ~3.5GB pip cache restore plus torch/RL wheels repeatedly exhausts the
      # ubuntu-latest runner during dependency install.
      - name: Free disk space (unused Android SDK + .NET toolchains)
        uses: ./.github/actions/free-disk-space

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Set up Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.2  # pinned: "latest" drifted to pnpm 11 which hard-fails on ignored builds

      - name: Install Python dependencies
        run: |
          pip install -q -r engine/requirements-core.txt
          pip install -q mypy==1.8.0 types-requests ruff==0.8.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      - name: Run all checks
        run: |
          echo "=== Running Python Linting ==="
          cd engine
          ruff check . --config ruff.toml
          # ruff format --check intentionally not enforced (see ci.yml note).
          cd ..

          echo "=== Running Type Checking (advisory mypy debt) ==="
          # Full-tree mypy is intentionally advisory until issue #942 burns down the
          # inherited baseline. Run from engine/ to match engine/pyproject.toml's
          # package-base assumptions, keep the debt visible in logs, and avoid
          # GitHub warning annotations for an expected non-blocking signal.
          (
            cd engine
            mypy . --ignore-missing-imports --config-file pyproject.toml \
              --explicit-package-bases --namespace-packages
          ) || echo "::notice::Full-tree mypy remains advisory; see issue #942 for debt burn-down."

          echo "=== Running Tests (fast then slow — parity with ci.yml engine-test) ==="
          pytest engine/tests/ -m "not slow" \
            -v --tb=short --cov=engine --cov-report=term-missing --cov-report=xml
          pytest engine/tests/ -m slow \
            -v --tb=short --cov=engine --cov-append --cov-report=term-missing --cov-report=xml \
            || { ec=$?; if [[ $ec -eq 5 ]]; then echo "No slow tests collected; skipping slow pass"; exit 0; fi; exit "$ec"; }

          echo "=== Building Dashboard ==="
          cd dashboard && pnpm run build && cd ..

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Verify environment safety
        run: |
          # Check that .env does not exist (should use .env.example)
          if [[ -f "engine/.env" ]]; then
            echo "ERROR: .env file should not be in repository"
            exit 1
          fi

          # Check that .env.example exists
          if [[ ! -f "engine/.env.example" ]]; then
            echo "ERROR: .env.example file not found"
            exit 1
          fi

          echo "✓ Environment config files verified"

      - name: Final security scan
        run: |
          set -euo pipefail
          echo "=== Checking for raw secret material ==="
          HITS=$(grep -rE "sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}|sk_live_[0-9a-zA-Z]{20,}|xox[baprs]-[0-9a-z-]{10,}|AKIA[0-9A-Z]{16}" \
            --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.next \
            engine/ dashboard/ 2>/dev/null || true)
          if [[ -n "${HITS}" ]]; then
            echo "${HITS}"
            echo "ERROR: Raw API keys detected before deploy!"
            exit 1
          fi
          echo "✓ No high-signal secret patterns in code"

      - name: Deploy verification passed
        run: |
          echo "✓ All pre-deploy checks passed!"
          echo "✓ Ready for deployment to production"
