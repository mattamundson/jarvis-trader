name: Branch Hygiene

# Weekly automated branch cleanup and PR health monitoring, tuned for a
# high-volume strategy dev cycle (5+ PRs/week, mix of bot + human authors).
#
# What runs (every Monday 11:00 UTC = 06:00 America/Chicago summer):
#   1. cleanup-merged: delete already-merged branches older than 7 days
#   2. stale-branches: flag unmerged branches idle 45+ days for human review
#   3. pr-health: file a rich PR-health issue with author velocity, bot/human
#      split, type breakdown, and stuck-on-review vs stuck-on-author metrics
#
# Merged-branch deletion is safe (commits preserved in master's history).
# Unmerged-branch deletion is never automatic — always flagged for review.

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report but don't delete)"
        type: boolean
        default: true

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cleanup-merged:
    name: Delete merged stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prune deleted-on-remote refs
        run: git remote prune origin

      - name: Delete merged branches older than 7 days
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          cutoff=$(date -d '7 days ago' +%s)
          deleted_count=0
          echo "Cutoff timestamp: $cutoff ($(date -d @$cutoff -Iseconds))"
          echo ""
          merged=$(git branch -r --merged origin/master | grep -v -E '(HEAD|master|main|develop|release/)' || true)
          for br in $merged; do
            name="${br#origin/}"
            last=$(git log -1 --format=%ct "$br" 2>/dev/null || echo 0)
            if [ "$last" -lt "$cutoff" ]; then
              age_days=$(( (cutoff - last) / 86400 + 7 ))
              if [ "$DRY_RUN" = "true" ]; then
                echo "[DRY RUN] would delete: $name (age ${age_days}d)"
              else
                echo "Deleting: $name (age ${age_days}d)"
                git push origin --delete "$name" 2>&1 || echo "  (delete failed, continuing)"
                deleted_count=$((deleted_count + 1))
              fi
            fi
          done
          echo ""
          echo "Total actionable: $deleted_count"

      - name: Compute stale unmerged branches (>= 45 days)
        id: stale
        run: |
          set -euo pipefail
          cutoff=$(date -d '45 days ago' +%s)
          stale_list=""
          all_remote=$(git branch -r --no-merged origin/master | grep -v -E '(HEAD|master|main|develop|release/)' || true)
          for br in $all_remote; do
            name="${br#origin/}"
            last=$(git log -1 --format=%ct "$br" 2>/dev/null || echo 0)
            if [ "$last" -lt "$cutoff" ]; then
              age_days=$(( ( $(date +%s) - last ) / 86400 ))
              stale_list="${stale_list}- \`${name}\` — last commit ${age_days}d ago\n"
            fi
          done
          if [ -n "$stale_list" ]; then
            printf "%b" "$stale_list" > stale_branches.txt
            echo "have_stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File stale-branch tracking issue
        if: steps.stale.outputs.have_stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stale = fs.readFileSync('stale_branches.txt', 'utf8');
            const week = new Date().toISOString().slice(0, 10);
            const title = `Stale branches report — ${week}`;
            const body = `The following unmerged branches have had no commits for 45+ days. ` +
                         `Review and either merge, close a PR, or manually delete.\n\n${stale}\n\n` +
                         `_Auto-generated by .github/workflows/branch-hygiene.yml_`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['maintenance', 'branch-cleanup'],
            });

  pr-health-report:
    name: PR health report (tuned for high volume)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compute rich PR health
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const dayMs = 24 * 60 * 60 * 1000;

            // === Load open PRs ===
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });

            // === Also load recently-closed for velocity ===
            const closed = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'closed', per_page: 100, sort: 'updated', direction: 'desc',
            });
            const closedThisWeek = closed.filter(p => {
              const closedAt = new Date(p.closed_at);
              return (now - closedAt) < 7 * dayMs;
            });
            const openedThisWeek = [...prs, ...closed].filter(p => {
              const created = new Date(p.created_at);
              return (now - created) < 7 * dayMs;
            });

            // === Classification helpers ===
            const isBot = (login) => {
              if (!login) return false;
              const l = login.toLowerCase();
              return l.includes('bot') || l.includes('claude') || l.includes('agent') ||
                     l === 'dependabot[bot]' || l === 'github-actions[bot]';
            };
            const isBotBranch = (name) => {
              if (!name) return false;
              return /^(claude\/|agent\/|copilot\/|dependabot\/|renovate\/|bot\/)/.test(name);
            };
            const prType = (title) => {
              const t = (title || '').toLowerCase();
              // Conventional-commit prefix
              const m = t.match(/^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert)(?:\([^)]*\))?[:!]/);
              return m ? m[1] : 'other';
            };
            const isReadyForReview = (p) => !p.draft;
            const isDraft = (p) => p.draft;

            // === Compute review vs author stuck-on ===
            // "stuck on review" heuristic: PR is ready, has reviews requested, and no push in >= 3 days
            // "stuck on author" heuristic: PR has reviewer comments/change-requests and no push since
            // For efficiency we approximate: age since updated
            const stuckOnReview = prs.filter(p => 
              isReadyForReview(p) && 
              p.requested_reviewers && p.requested_reviewers.length > 0 &&
              (now - new Date(p.updated_at)) > 3 * dayMs
            );
            const stuckOldReady = prs.filter(p =>
              isReadyForReview(p) &&
              (now - new Date(p.updated_at)) > 7 * dayMs
            );

            // === Author velocity (last 7 days) ===
            const velocityByAuthor = {};
            for (const p of openedThisWeek) {
              const a = p.user?.login || 'unknown';
              if (!velocityByAuthor[a]) velocityByAuthor[a] = { opened: 0, merged: 0, closed_unmerged: 0, is_bot: isBot(a) };
              velocityByAuthor[a].opened += 1;
            }
            for (const p of closedThisWeek) {
              const a = p.user?.login || 'unknown';
              if (!velocityByAuthor[a]) velocityByAuthor[a] = { opened: 0, merged: 0, closed_unmerged: 0, is_bot: isBot(a) };
              if (p.merged_at) velocityByAuthor[a].merged += 1;
              else velocityByAuthor[a].closed_unmerged += 1;
            }

            // === Bot/human split ===
            let botOpen = 0, humanOpen = 0;
            for (const p of prs) {
              if (isBot(p.user?.login) || isBotBranch(p.head?.ref)) botOpen++;
              else humanOpen++;
            }

            // === Type breakdown ===
            const typeCounts = {};
            for (const p of prs) {
              const t = prType(p.title);
              typeCounts[t] = (typeCounts[t] || 0) + 1;
            }

            // === Age buckets ===
            const buckets = { '<3d': 0, '3-7d': 0, '7-14d': 0, '14-30d': 0, '30d+': 0 };
            for (const p of prs) {
              const age = (now - new Date(p.created_at)) / dayMs;
              if (age < 3) buckets['<3d']++;
              else if (age < 7) buckets['3-7d']++;
              else if (age < 14) buckets['7-14d']++;
              else if (age < 30) buckets['14-30d']++;
              else buckets['30d+']++;
            }

            // === Render markdown ===
            const week = now.toISOString().slice(0, 10);
            const lines = [];
            lines.push(`## Weekly PR health — ${week}`);
            lines.push('');
            lines.push(`**Snapshot:** ${prs.length} open (${prs.filter(isDraft).length} draft, ${prs.filter(isReadyForReview).length} ready). Bot ${botOpen} vs human ${humanOpen}.`);
            lines.push('');

            // Weekly velocity
            const weeklyOpened = openedThisWeek.length;
            const weeklyMerged = closedThisWeek.filter(p => p.merged_at).length;
            const weeklyClosedUnmerged = closedThisWeek.filter(p => !p.merged_at).length;
            const throughput = weeklyMerged - weeklyOpened; // negative = growing backlog
            lines.push('### Weekly velocity');
            lines.push(`- Opened: **${weeklyOpened}**`);
            lines.push(`- Merged: **${weeklyMerged}**`);
            lines.push(`- Closed unmerged: **${weeklyClosedUnmerged}**`);
            lines.push(`- Net (merged − opened): **${throughput >= 0 ? '+' : ''}${throughput}** ${throughput < 0 ? '(⚠️ backlog growing)' : ''}`);
            lines.push('');

            // Author velocity table
            const authorRows = Object.entries(velocityByAuthor)
              .sort((a, b) => (b[1].opened + b[1].merged) - (a[1].opened + a[1].merged));
            lines.push('### Author velocity (last 7 days)');
            lines.push('| Author | Type | Opened | Merged | Closed unmerged |');
            lines.push('|---|---|---:|---:|---:|');
            for (const [a, v] of authorRows.slice(0, 20)) {
              lines.push(`| @${a} | ${v.is_bot ? '🤖 bot' : 'human'} | ${v.opened} | ${v.merged} | ${v.closed_unmerged} |`);
            }
            lines.push('');

            // Type breakdown
            lines.push('### Open PRs by type');
            const sortedTypes = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]);
            for (const [t, n] of sortedTypes) lines.push(`- \`${t}\`: ${n}`);
            lines.push('');

            // Age buckets
            lines.push('### Age buckets (from creation)');
            for (const [k, v] of Object.entries(buckets)) lines.push(`- ${k}: ${v}`);
            lines.push('');

            // Stuck-on report
            lines.push('### Stuck-on report');
            lines.push(`- **Stuck-on-review** (≥3d since update, has requested reviewers): ${stuckOnReview.length}`);
            lines.push(`- **Ready but idle 7d+**: ${stuckOldReady.length}`);
            if (stuckOldReady.length > 0) {
              lines.push('');
              lines.push('  Oldest ready-and-idle:');
              const sortedStuck = stuckOldReady.sort((a, b) => new Date(a.updated_at) - new Date(b.updated_at)).slice(0, 10);
              for (const p of sortedStuck) {
                const days = Math.floor((now - new Date(p.updated_at)) / dayMs);
                const authorTag = isBot(p.user?.login) ? '🤖' : '';
                lines.push(`  - #${p.number} — [${p.title}](${p.html_url}) — ${days}d idle by @${p.user?.login} ${authorTag}`);
              }
            }
            lines.push('');

            // Oldest 15 (kept from v1 for continuity)
            lines.push('### Oldest 15 open PRs by last activity');
            const oldestActive = [...prs].sort((a, b) => new Date(a.updated_at) - new Date(b.updated_at)).slice(0, 15);
            for (const p of oldestActive) {
              const days = Math.floor((now - new Date(p.updated_at)) / dayMs);
              const draftTag = p.draft ? ' _(draft)_' : '';
              const botTag = isBot(p.user?.login) ? ' 🤖' : '';
              lines.push(`- #${p.number} — [${p.title}](${p.html_url})${draftTag} — ${days}d idle, @${p.user?.login}${botTag}`);
            }
            lines.push('');
            lines.push('---');
            lines.push('_Auto-generated by `.github/workflows/branch-hygiene.yml`._');
            lines.push('_To customize what appears here, edit the `pr-health-report` job._');

            const body = lines.join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `PR health — week of ${week}`,
              body: body,
              labels: ['maintenance', 'pr-health'],
            });
