name: Branch Hygiene

# Weekly automated branch cleanup and PR health monitoring.
#
# Actions taken automatically:
#   - Delete already-merged branches older than 7 days (safe: merged = no work lost)
#   - Flag stale unmerged branches (>= 45 days old, no PR open) via issue comment
#   - Post a weekly PR health summary as a GitHub issue
#
# The workflow does NOT delete unmerged branches automatically — those are only
# flagged for human review. Merged-branch deletion is safe because the commits
# are preserved in master's history.

on:
  schedule:
    # Every Monday at 11:00 UTC (06:00 America/Chicago summer, 05:00 winter)
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report but don't delete)"
        type: boolean
        default: true

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cleanup-merged:
    name: Delete merged stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prune deleted-on-remote refs
        run: git remote prune origin

      - name: Delete merged branches older than 7 days
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          # Cutoff: 7 days ago in unix time
          cutoff=$(date -d '7 days ago' +%s)
          deleted_count=0
          echo "Cutoff timestamp: $cutoff ($(date -d @$cutoff -Iseconds))"
          echo ""
          # List all remote branches merged into master, exclude protected ones
          merged=$(git branch -r --merged origin/master | grep -v -E '(HEAD|master|main|develop|release/)' || true)
          for br in $merged; do
            # Extract 'origin/name' -> 'name'
            name="${br#origin/}"
            # Get last-commit timestamp on this branch
            last=$(git log -1 --format=%ct "$br" 2>/dev/null || echo 0)
            if [ "$last" -lt "$cutoff" ]; then
              age_days=$(( (cutoff - last) / 86400 + 7 ))
              if [ "$DRY_RUN" = "true" ]; then
                echo "[DRY RUN] would delete: $name (age ${age_days}d)"
              else
                echo "Deleting: $name (age ${age_days}d)"
                git push origin --delete "$name" 2>&1 || echo "  (delete failed, continuing)"
                deleted_count=$((deleted_count + 1))
              fi
            fi
          done
          echo ""
          echo "Total actionable: $deleted_count"

      - name: Compute stale unmerged branches (>= 45 days)
        id: stale
        run: |
          set -euo pipefail
          cutoff=$(date -d '45 days ago' +%s)
          stale_list=""
          all_remote=$(git branch -r --no-merged origin/master | grep -v -E '(HEAD|master|main|develop|release/)' || true)
          for br in $all_remote; do
            name="${br#origin/}"
            last=$(git log -1 --format=%ct "$br" 2>/dev/null || echo 0)
            if [ "$last" -lt "$cutoff" ]; then
              age_days=$(( ( $(date +%s) - last ) / 86400 ))
              stale_list="${stale_list}- \`${name}\` — last commit ${age_days}d ago\n"
            fi
          done
          if [ -n "$stale_list" ]; then
            printf "%b" "$stale_list" > stale_branches.txt
            echo "have_stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File stale-branch tracking issue
        if: steps.stale.outputs.have_stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stale = fs.readFileSync('stale_branches.txt', 'utf8');
            const week = new Date().toISOString().slice(0, 10);
            const title = `Stale branches report — ${week}`;
            const body = `The following unmerged branches have had no commits for 45+ days. ` +
                         `Review and either merge, close a PR, or manually delete.\n\n${stale}\n\n` +
                         `_Auto-generated by .github/workflows/branch-hygiene.yml_`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['maintenance', 'branch-cleanup'],
            });

  pr-health:
    name: PR health summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compute PR health
        uses: actions/github-script@v7
        id: health
        with:
          script: |
            const now = new Date();
            const dayMs = 24 * 60 * 60 * 1000;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const open = prs.length;
            const drafts = prs.filter(p => p.draft).length;
            const readyOld = prs.filter(p => !p.draft && (now - new Date(p.updated_at)) > 14 * dayMs).length;
            const buckets = { '<3d': 0, '3-7d': 0, '7-14d': 0, '14-30d': 0, '30d+': 0 };
            for (const p of prs) {
              const age = (now - new Date(p.created_at)) / dayMs;
              if (age < 3) buckets['<3d']++;
              else if (age < 7) buckets['3-7d']++;
              else if (age < 14) buckets['7-14d']++;
              else if (age < 30) buckets['14-30d']++;
              else buckets['30d+']++;
            }
            const listing = prs
              .sort((a, b) => new Date(a.updated_at) - new Date(b.updated_at))
              .slice(0, 15)
              .map(p => {
                const ageDays = Math.floor((now - new Date(p.updated_at)) / dayMs);
                const draftTag = p.draft ? ' _(draft)_' : '';
                return `- #${p.number} — [${p.title}](${p.html_url})${draftTag} — updated ${ageDays}d ago by @${p.user.login}`;
              })
              .join('\n');
            const summary = [
              `## Weekly PR health — ${now.toISOString().slice(0, 10)}`,
              '',
              `- **Open PRs:** ${open} (${drafts} draft, ${open - drafts} ready)`,
              `- **Ready PRs untouched for 14+ days:** ${readyOld}`,
              '',
              '### Age buckets',
              Object.entries(buckets).map(([k, v]) => `- ${k}: ${v}`).join('\n'),
              '',
              '### Oldest 15 by last activity',
              listing || '_no open PRs_',
              '',
              '_Auto-generated by .github/workflows/branch-hygiene.yml_',
            ].join('\n');
            const week = now.toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `PR health — week of ${week}`,
              body: summary,
              labels: ['maintenance', 'pr-health'],
            });
