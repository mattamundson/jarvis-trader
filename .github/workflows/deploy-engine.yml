name: Deploy Engine → Railway

on:
  push:
    branches: [deploy/dashboard]
    paths:
      - 'engine/**'
      - 'Dockerfile'
      - 'railway.toml'
      - '.github/workflows/deploy-engine.yml'

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate: engine lint + fast tests must pass before Railway deploy fires
  # ─────────────────────────────────────────────────────────────────────────────
  engine-gate:
    name: Engine Gate (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt
          pip install -q ruff==0.8.0

      - name: Ruff lint
        run: |
          cd engine
          ruff check . --config ruff.toml

      - name: Ruff format check
        run: |
          cd engine
          ruff format --check . --config ruff.toml

      - name: Pytest fast slice
        run: |
          pytest engine/tests/ -m "not slow" \
            -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to Railway via CLI
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-railway:
    name: Deploy → Railway (Strategy C+ Engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [engine-gate]
    environment:
      name: production-engine
      url: https://jarvis-trader-production.up.railway.app

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          railway version

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service=${{ secrets.RAILWAY_SERVICE_ID }} \
            --detach

      - name: Wait for deployment health
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Waiting 60s for Railway to build and start..."
          sleep 60
          MAX_ATTEMPTS=12
          ATTEMPT=0
          while [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; do
            HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
              "https://jarvis-trader-production.up.railway.app/health" \
              --max-time 15 || echo "000")
            echo "Attempt $((ATTEMPT+1))/${MAX_ATTEMPTS}: /health returned ${HTTP}"
            if [[ "${HTTP}" == "200" ]]; then
              echo "Engine is healthy."
              break
            fi
            ATTEMPT=$((ATTEMPT+1))
            sleep 15
          done
          if [[ "${HTTP}" != "200" ]]; then
            echo "ERROR: Engine did not reach healthy state after $((MAX_ATTEMPTS * 15 + 60))s"
            exit 1
          fi

      - name: Verify Strategy C+ endpoint
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
            "https://jarvis-trader-production.up.railway.app/strategy-c/signal" \
            -H "X-Api-Key: ${{ secrets.ENGINE_API_KEY }}" \
            --max-time 20 || echo "000")
          echo "/strategy-c/signal returned: ${HTTP}"
          if [[ "${HTTP}" != "200" ]]; then
            echo "WARNING: Strategy C+ signal endpoint not returning 200 (got ${HTTP})."
            echo "Engine may still be warming up signal data. Deployment itself succeeded."
          fi

      - name: Summary
        run: |
          echo "### Railway Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Strategy C+ Engine" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Health:** https://jarvis-trader-production.up.railway.app/health" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Notify on failure (runs even if deploy-railway fails)
  # ─────────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on Deploy Failure
    runs-on: ubuntu-latest
    needs: [deploy-railway]
    if: failure()
    steps:
      - name: Annotate failure
        run: |
          echo "::error::Railway deploy failed for commit ${{ github.sha }}."
          echo "::error::Check Railway dashboard: https://railway.app/project/${{ secrets.RAILWAY_PROJECT_ID }}"
