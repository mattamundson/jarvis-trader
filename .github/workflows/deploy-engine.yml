name: Deploy Engine → Railway

on:
  push:
    branches: [deploy/dashboard]
    paths:
      - 'engine/**'
      - 'Dockerfile'
      - 'railway.toml'
      - '.github/workflows/deploy-engine.yml'

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate: lint + fast tests must pass before Railway deploy fires
  # ─────────────────────────────────────────────────────────────────────────────
  engine-gate:
    name: Engine Gate (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt
          pip install -q ruff==0.8.0

      - name: Ruff lint
        run: cd engine && ruff check . --config ruff.toml

      - name: Ruff format check
        run: cd engine && ruff format --check . --config ruff.toml

      - name: Pytest fast slice
        run: |
          pytest engine/tests/ -m "not slow" -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to Railway
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-railway:
    name: Deploy → Railway (Strategy C+ Engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [engine-gate]
    environment:
      name: production-engine
      url: https://jarvis-trader-production.up.railway.app

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service=${{ secrets.RAILWAY_SERVICE_ID }} \
            --detach

      - name: Wait for deployment health
        run: |
          echo "Waiting 60s for Railway build..."
          sleep 60
          MAX_ATTEMPTS=12
          ATTEMPT=0
          HTTP="000"
          while [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; do
            HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
              "https://jarvis-trader-production.up.railway.app/health" \
              --max-time 15 || echo "000")
            echo "Attempt $((ATTEMPT+1))/${MAX_ATTEMPTS}: /health → ${HTTP}"
            if [[ "${HTTP}" == "200" ]]; then break; fi
            ATTEMPT=$((ATTEMPT+1))
            sleep 15
          done
          if [[ "${HTTP}" != "200" ]]; then
            echo "ERROR: Engine did not reach healthy state."
            exit 1
          fi

      - name: Verify Strategy C+ signal endpoint
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
            "https://jarvis-trader-production.up.railway.app/strategy-c/signal" \
            -H "X-Api-Key: ${{ secrets.ENGINE_API_KEY }}" \
            --max-time 20 || echo "000")
          echo "/strategy-c/signal → ${HTTP}"
          if [[ "${HTTP}" != "200" ]]; then
            echo "WARNING: Signal endpoint returned ${HTTP} — engine warming up. Deploy succeeded."
          fi

      - name: Notify Discord — deploy success
        if: success()
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          curl -s -o /dev/null -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"✅ Engine Deployed — Railway\",
              \"color\": 3066993,
              \"fields\": [
                {\"name\": \"Service\", \"value\": \"Strategy C+ Engine\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"\`${SHORT_SHA}\`\", \"inline\": true},
                {\"name\": \"Health\", \"value\": \"[/health](https://jarvis-trader-production.up.railway.app/health)\", \"inline\": false}
              ],
              \"footer\": {\"text\": \"Jarvis Trader · GitHub Actions\"},
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Summary
        run: |
          echo "### Railway Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Health:** https://jarvis-trader-production.up.railway.app/health" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Discord alert on any job failure
  # ─────────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Discord — Deploy Failure Alert
    runs-on: ubuntu-latest
    needs: [engine-gate, deploy-railway]
    if: failure()
    steps:
      - name: Post failure to Discord
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"🚨 Engine Deploy FAILED — Railway\",
              \"description\": \"Strategy C+ engine deploy pipeline failed on \`deploy/dashboard\`.\",
              \"color\": 15158332,
              \"fields\": [
                {\"name\": \"Commit\", \"value\": \"\`${SHORT_SHA}\`\", \"inline\": true},
                {\"name\": \"Branch\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                {\"name\": \"Railway\", \"value\": \"[Dashboard](https://railway.app/project/${{ secrets.RAILWAY_PROJECT_ID }})\", \"inline\": true},
                {\"name\": \"Logs\", \"value\": \"[View run](${RUN_URL})\", \"inline\": false}
              ],
              \"footer\": {\"text\": \"Jarvis Trader · GitHub Actions\"},
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "${{ secrets.DISCORD_WEBHOOK_URL }}"
