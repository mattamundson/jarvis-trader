name: JARVIS TRADER CI

# 1. Global permissions for the workflow token
permissions:
  contents: read

# 2. Workflow triggers
on:
  push:
    branches: [main, master, develop]
  pull_request:
    # ready_for_review is required: jobs below are gated to skip draft PRs (verified
    # for free by the local pr-local-ci loop), so converting draft -> ready must
    # re-trigger CI. Without it, a PR opened as draft would never get cloud CI.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]

# 3. Concurrency management
concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 4. Jobs definition
jobs:
  engine-lint:
    name: Engine Lint (Python)
    # Skip draft PRs (covered for free by the local pr-local-ci loop); still runs on
    # push to protected branches and on ready-for-review PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install ruff
        run: pip install ruff==0.8.0

      # Run from engine/ so isort treats agents, config, database, … as first-party
      # (ruff check engine/ from repo root mis-classifies them and fails I001).
      - name: Run ruff check
        run: |
          cd engine
          ruff check . --config ruff.toml

      # NOTE: `ruff format --check` intentionally NOT enforced. The engine was
      # never consistently auto-formatted (the repo carries a [tool.black] config
      # that CI does not run, and black/ruff disagree on ~55% of files). Enforcing
      # ruff format would mean a 350+ file reformat with no behavior change. The
      # `ruff check` lint gate above is what we enforce; a deliberate formatter
      # adoption can be a separate, planned change.

  # The complement of the draft gate above. Every other job here skips draft PRs,
  # on the stated grounds that the local pr-local-ci loop covers them for free.
  # That justification does not hold:
  #   - pr-local-ci fires once a day and needs this machine awake;
  #   - on 2026-07-31 it was found to have been checking ZERO PRs since it was
  #     created -- a malformed `gh pr list --json` argument split across argv and
  #     silently skipped every repo, with stderr suppressed;
  #   - drafts are not a rounding error: 7 of 30 open PRs target master as drafts,
  #     carrying 49 changed .py files between them.
  #
  # This job runs ONLY on drafts, so it never duplicates engine-lint. The two
  # together mean every PR gets ruff in every state, from cloud CI rather than
  # from a machine that may be asleep.
  #
  # Deliberately cheap (~1 min): lint plus a byte-compile, not the pytest suite.
  # Full tests still wait for ready-for-review, which is in the trigger `types`
  # above so the conversion re-fires CI.
  #
  # Not added to required status checks and not wired into ci-summary: it runs
  # only while a PR is a draft, and a draft cannot merge, so a red result here
  # blocks nothing -- it is signal for the author, not a gate.
  engine-draft-check:
    name: Engine Draft Check (ruff + compile)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install ruff
        run: pip install ruff==0.8.0

      # Same invocation as engine-lint: run from engine/ so isort treats agents,
      # config, database, ... as first-party (from repo root it fails I001).
      - name: Run ruff check
        run: |
          cd engine
          ruff check . --config ruff.toml

      # Catches syntax errors that reach the parser but never a test run, which
      # matters most on drafts precisely because pytest is not running here.
      - name: Byte-compile engine sources
        run: python -m compileall -q engine -x '(\.venv|node_modules|__pycache__|site-packages)'

  engine-typecheck:
    name: Engine Type Check (mypy)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # See .github/actions/free-disk-space/action.yml for why this runs here
      # (engine/requirements-core.txt's torch/gymnasium/stable-baselines3 install
      # + pip's ~3.5GB cache restore ran this runner out of disk repeatedly).
      - name: Free disk space (unused Android SDK + .NET toolchains)
        uses: ./.github/actions/free-disk-space

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt
          pip install -q mypy==1.8.0 types-requests

      # Allowlist + --follow-imports=skip for small modules that would otherwise pull the whole app graph.
      - name: Mypy gate (allowlisted clean files)
        run: |
          mypy engine/tests/test_paper_runner_engine_sync.py \
            engine/tests/test_portfolio_paper_trade_post.py \
            engine/routers/validation_router.py \
            engine/execution/paper_trade_logger.py \
            --ignore-missing-imports --config-file engine/pyproject.toml \
            --explicit-package-bases --namespace-packages \
            --follow-imports=skip

      - name: Run mypy type checking
        continue-on-error: true
        run: |
          # Full-tree mypy has legacy debt (300+); keep visible, non-blocking until tightened.
          mypy engine/ --ignore-missing-imports --config-file engine/pyproject.toml \
            --explicit-package-bases --namespace-packages

  # Parallel slices (wall-clock): fast ~unit/router + slow integration/E2E (see pytest.mark.slow).
  engine-test-fast:
    name: Engine Tests (pytest, fast)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # Headroom for the (rare) second attempt of the flake retry below.
    timeout-minutes: 28
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.fast
    steps:
      - uses: actions/checkout@v4

      # See .github/actions/free-disk-space/action.yml for why this runs here.
      - name: Free disk space (unused Android SDK + .NET toolchains)
        uses: ./.github/actions/free-disk-space

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt

      - name: Strategic metrics snapshot script
        run: python scripts/strategic_snapshot.py

      - name: Run pytest (-m "not slow and not manual")
        run: |
          # Process-level retry for the intermittent scanner / strategy-validation
          # pollution flake: an upstream test occasionally dirties process-global
          # state (env / config singleton), making ~21 scanner tests' scan_symbol
          # short-circuit and fail together. Whether it fires varies with per-process
          # ordering / PYTHONHASHSEED, so re-running in a FRESH process clears it (a
          # test-level --reruns in the same dirtied process would NOT). Proven flaky:
          # a failed fast job re-ran red->green on identical code. The retry stays
          # visible (::warning::) so a genuine regression is never silently masked.
          # Root cause tracked in project_ci_flaky_scanner_pollution_2026_06_16.
          #
          # `not manual` keeps the IB-Gateway e2e tests (which hang the asyncio loop
          # with no timeout) out of the default slice -- a CLI -m overrides pyproject's
          # `-m "not manual"` default, so it must be restated here.
          set +e
          attempts=2
          ec=0
          for i in $(seq 1 "$attempts"); do
            echo "::group::pytest fast (attempt $i/$attempts)"
            pytest engine/tests/ -m "not slow and not manual" \
              -v --tb=short --cov=engine --cov-report=term-missing
            ec=$?
            echo "::endgroup::"
            [ "$ec" -eq 0 ] && break
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning title=fast-suite retry::attempt $i failed (exit $ec); retrying once in a fresh process (intermittent scanner-pollution flake)"
            fi
          done
          exit "$ec"

      - name: Upload coverage data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-fast
          path: .coverage.fast
          include-hidden-files: true
          retention-days: 7

  engine-test-slow:
    name: Engine Tests (pytest, slow)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.slow
    steps:
      - uses: actions/checkout@v4

      # See .github/actions/free-disk-space/action.yml for why this runs here.
      - name: Free disk space (unused Android SDK + .NET toolchains)
        uses: ./.github/actions/free-disk-space

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt

      - name: Run pytest (-m "slow and not manual")
        run: |
          # `not manual` restated: a CLI -m overrides pyproject's `-m "not manual"`
          # default, and the IB-Gateway e2e tests must never be collected in CI.
          pytest engine/tests/ -m "slow and not manual" \
            -v --tb=short --cov=engine --cov-report=term-missing \
            || { ec=$?; if [[ $ec -eq 5 ]]; then echo "No slow tests collected; skipping slow slice"; exit 0; fi; exit "$ec"; }

      - name: Upload coverage data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-slow
          path: .coverage.slow
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  engine-coverage-merge:
    name: Engine Tests (coverage merge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [engine-test-fast, engine-test-slow]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.engine-test-fast.result == 'success' && needs.engine-test-slow.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # See .github/actions/free-disk-space/action.yml for why this runs here.
      - name: Free disk space (unused Android SDK + .NET toolchains)
        uses: ./.github/actions/free-disk-space

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install coverage
        run: pip install -q -r engine/requirements-core.txt

      - name: Download fast coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-fast
          path: cov-fast

      - name: Download slow coverage data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-slow
          path: cov-slow

      - name: Combine and emit coverage.xml
        run: |
          cd "${GITHUB_WORKSPACE}"
          # upload-artifact preserves filename under the given directory
          FAST=$(find cov-fast -type f | head -1)
          SLOW=""
          if [[ -d cov-slow ]]; then SLOW=$(find cov-slow -type f | head -1); fi
          if [[ -z "${FAST}" ]]; then echo "ERROR: missing fast coverage after download"; ls -laR cov-fast || true; exit 1; fi
          if [[ -n "${SLOW}" ]]; then
            coverage combine --rcfile=engine/pyproject.toml "${FAST}" "${SLOW}"
          else
            echo "No slow coverage file; using fast slice only"
            cp "${FAST}" .coverage
          fi
          # --fail-under=0 here: emit the XML artifact unconditionally (even if
          # below the floor) so it's available for debugging a coverage-floor
          # failure below. The real gate is the "Enforce coverage floor" step.
          coverage xml -o coverage.xml --rcfile=engine/pyproject.toml --fail-under=0

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      # PRB-17: coverage.xml was generated and uploaded as an artifact above,
      # but historically nothing gated on it -- a PR could drop coverage to 0%
      # and this job would still report success. This step fails the job (via
      # `fail_under` in engine/pyproject.toml's [tool.coverage.report], see the
      # comment there for how the baseline/floor were picked) if total line
      # coverage is below the pinned floor, and prints the per-file breakdown
      # so a genuine regression is easy to trace.
      - name: Enforce coverage floor (PRB-17)
        run: coverage report --rcfile=engine/pyproject.toml -m

  dashboard-build:
    name: Dashboard Build (Next.js)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check for case-only duplicate filenames (Vercel's build FS is case-sensitive)
        run: |
          dupes=$(git ls-files | sort -f | uniq -Di)
          if [ -n "$dupes" ]; then
            echo "::error::These tracked paths differ only in case - passes on macOS/Windows, fails Vercel's case-sensitive Linux build:"
            echo "$dupes"
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2  # pinned: "latest" drifted to pnpm 11 which hard-fails on ignored builds

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      # Output is tee'd so the bundle-budget gate below can read the route table
      # instead of paying for a second ~2 minute build to reprint numbers this
      # one already produced. pipefail keeps a build failure fatal through tee.
      # Retry once for the transient next/font/google network flake (fonts.gstatic.com
      # intermittently times out on the runner — proven flaky: the same build passed
      # on rerun with identical code, and master's own pre-deploy check failed the
      # same way on 2026-08-16). The retry stays visible (::warning::) so a genuine
      # build regression is never silently masked. A fresh process is required —
      # the failed font fetch leaves .next/font cache state that an in-place retry
      # would not necessarily clear.
      - name: Build Next.js
        run: |
          set -euo pipefail
          set +e
          attempts=2
          ec=0
          for i in $(seq 1 "$attempts"); do
            echo "::group::next build (attempt $i/$attempts)"
            pnpm run build 2>&1 | tee ../build-output.log
            ec=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$ec" -eq 0 ] && break
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning title=dashboard-build retry::attempt $i failed (exit $ec); retrying once in a fresh process (intermittent next/font/google font-fetch flake)"
            fi
          done
          exit "$ec"
        working-directory: dashboard
        env:
          NODE_ENV: production

      - name: Bundle-size budget (First Load JS)
        run: node scripts/check-bundle-budget.mjs ../build-output.log
        working-directory: dashboard

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: dashboard

      # No --project filter: this runs BOTH playwright.config.ts projects --
      # `smoke` (table-driven, all 50 manifest routes x degraded/offline/slow)
      # and `golden-path` (the hand-written domain specs, incl. the API-key-leak
      # security check). reuseExistingServer is false in CI (see
      # playwright.config.ts), so this always exercises the build just produced
      # above, never a stale server. Step name predates the smoke suite --
      # kept the misnomer fixed here so CI logs describe what actually runs.
      - name: E2E -- smoke (50 routes) + golden-path
        run: pnpm exec playwright test
        working-directory: dashboard

      - name: No bare await fetch in dashboard app/hooks
        run: |
          set -euo pipefail
          # Exempt Next.js server route handlers under app/api/ — they are server
          # infra (e.g. the engine proxy at app/api/engine/[...path]/route.ts) and
          # legitimately use raw fetch; the typed lib/api.ts wrappers route THROUGH
          # that proxy, so they cannot be used there. The guard targets client/UI code.
          HITS=$(grep -r "await fetch(" dashboard/app dashboard/hooks \
            --include="*.tsx" --include="*.ts" --exclude-dir=api 2>/dev/null || true)
          if [[ -n "${HITS}" ]]; then
            echo "${HITS}"
            echo "ERROR: Use fetchEngine/postEngine from dashboard/lib/api.ts instead of bare fetch."
            exit 1
          fi
          echo "OK: no bare await fetch in dashboard/app or dashboard/hooks."

      - name: No bare await fetch in dashboard components
        run: |
          set -euo pipefail
          HITS=$(grep -r "await fetch(" dashboard/components \
            --include="*.tsx" --include="*.ts" 2>/dev/null || true)
          if [[ -n "${HITS}" ]]; then
            echo "${HITS}"
            echo "ERROR: Use fetchEngine/postEngine/fetchEngineRaw from dashboard/lib/api.ts instead of bare fetch."
            exit 1
          fi
          echo "OK: no bare await fetch in dashboard/components."

  dashboard-quality:
    name: Dashboard Quality (typecheck + unit tests)
    # Deliberately NOT gated on draft == false. dashboard-build and every other
    # job here skip drafts, and 7 of 30 open PRs are drafts, so nothing checks
    # their .tsx at all. The stated fallback was the pr-local-ci loop, but that
    # runs py_compile + ruff on changed *.py only, once daily, and needs this
    # machine awake -- it has never checked a TypeScript file. This job is cheap
    # (~2 min, no browser, no build) so it runs on drafts too.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Runs BEFORE install on purpose: check-guards.mjs uses only node built-ins,
      # so a guard violation fails in seconds instead of after a ~90s install.
      # Invoked as `node` rather than `pnpm run guards` precisely because pnpm is
      # not on PATH yet at this point -- `pnpm run guards` is the local entrypoint.
      - name: Static guards (engine URL, bare fetch, dead dynamic import, poll ratchet)
        run: node scripts/check-guards.mjs
        working-directory: dashboard

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2  # pinned to match dashboard-build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      # `next build` does NOT fail on unused imports or most type-adjacent
      # smells, so it was never the typecheck it was being treated as.
      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck
        working-directory: dashboard

      - name: Unit tests (node:test)
        run: pnpm run test:unit
        working-directory: dashboard

  security-scan:
    name: Security Scan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for .env files
        run: |
          if find . -name '.env' -o -name '.env.local' -o -name '.env.*.local' | grep -v '.env.example' | grep -v 'node_modules'; then
            echo "ERROR: Untracked .env files found. These should never be committed."
            exit 1
          fi

      # INC-15 (2026-08-16): Secret-Value.csv sat undetected at the repo tip for 48
      # days because no check ever looked at the filename — the content scan below
      # only covers *.py/*.ts/*.tsx/*.js, and a credential export named after its
      # own shape (a 1Password/Perplexity-style CSV dump) has no code-file content
      # to match. scripts/hooks/check-secrets.sh (c8b1f02) added the same filename
      # patterns to the local pre-commit hook, but that hook is opt-in and can be
      # bypassed (--no-verify, not installed, pushed from an unhooked machine) —
      # this step is the non-bypassable backstop. Keep these patterns in sync with
      # FILENAME_PATTERNS in scripts/hooks/check-secrets.sh.
      - name: Check for secret-shaped filenames
        run: |
          set -euo pipefail
          HITS=$(git ls-files | grep -E '[Ss]ecret.*\.csv$|[Cc]redential.*\.csv$|\.pem$|\.p12$|\.pfx$' || true)
          if [[ -n "${HITS}" ]]; then
            echo "${HITS}"
            echo "ERROR: Secret-shaped filename(s) found in the repo tree. Even if the content"
            echo "looks harmless, files named like a credential export should never be committed."
            exit 1
          fi
          echo "No secret-shaped filenames found."

      - name: Check for hardcoded secrets
        run: |
          set -euo pipefail
          # Raw key material only — avoids false positives on settings.ANTHROPIC_API_KEY, risk_*, etc.
          # File types include data/export formats (csv, json, yaml, md, txt) in addition to code —
          # INC-15's leaked CSV had no code-file content to match, only *.py/*.ts/*.tsx/*.js were
          # ever scanned here, so a credential value pasted into a non-code file was invisible to CI.
          HITS=$(grep -rE "sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}|sk_live_[0-9a-zA-Z]{20,}|xox[baprs]-[0-9a-z-]{10,}|AKIA[0-9A-Z]{16}" \
            --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" \
            --include="*.csv" --include="*.json" --include="*.yaml" --include="*.yml" \
            --include="*.md" --include="*.txt" \
            --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.next \
            engine/ dashboard/ 2>/dev/null || true)
          if [[ -n "${HITS}" ]]; then
            echo "${HITS}"
            echo "ERROR: Potential raw API keys detected in repository."
            exit 1
          fi
          echo "Security scan passed: no high-signal secret patterns matched."

  ci-summary:
    name: CI Summary
    needs:
      - engine-lint
      - engine-typecheck
      - engine-test-fast
      - engine-test-slow
      - engine-coverage-merge
      - dashboard-build
      - dashboard-quality
      - security-scan
    runs-on: ubuntu-latest
    # always() so it reports even when a needed job fails -- but still skip on draft PRs.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - name: Check CI results
        run: |
          if [[ "${{ needs.engine-lint.result }}" != "success" || \
                "${{ needs.engine-typecheck.result }}" != "success" || \
                "${{ needs.engine-test-fast.result }}" != "success" || \
                "${{ needs.engine-test-slow.result }}" != "success" || \
                "${{ needs.dashboard-build.result }}" != "success" || \
                "${{ needs.dashboard-quality.result }}" != "success" || \
                "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "⚠️  Some CI checks failed. Please review the logs above."
            exit 1
          fi
          if [[ "${{ needs.engine-test-fast.result }}" == "success" && \
                "${{ needs.engine-test-slow.result }}" == "success" && \
                "${{ needs.engine-coverage-merge.result }}" != "success" ]]; then
            echo "⚠️  Coverage merge failed while both pytest slices passed."
            exit 1
          fi
          echo "✓ All CI checks passed!"
