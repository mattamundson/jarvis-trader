name: JARVIS TRADER CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  engine-lint:
    name: Engine Lint (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install ruff
        run: pip install ruff==0.8.0

      - name: Run ruff check
        run: ruff check engine/ --config engine/ruff.toml

      - name: Run ruff format check
        run: ruff format --check engine/ --config engine/ruff.toml

  engine-typecheck:
    name: Engine Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt
          pip install -q mypy==1.8.0

      - name: Run mypy type checking
        run: mypy engine/ --ignore-missing-imports --config-file engine/pyproject.toml

  engine-test:
    name: Engine Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt
          pip install -q pytest-cov==5.0.0

      - name: Run pytest
        run: pytest engine/tests/ -v --tb=short --cov=engine --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  dashboard-build:
    name: Dashboard Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      - name: Build Next.js
        run: pnpm run build
        working-directory: dashboard
        env:
          NODE_ENV: production

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for .env files
        run: |
          if find . -name '.env' -o -name '.env.local' -o -name '.env.*.local' | grep -v '.env.example' | grep -v 'node_modules'; then
            echo "ERROR: Untracked .env files found. These should never be committed."
            exit 1
          fi

      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns
          if grep -r "ANTHROPIC_API_KEY\|SK_.*\|sk_.*\|aws_secret\|password.*=\|secret.*=" \
            --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" \
            engine/ dashboard/ \
            | grep -v "example\|fake\|dummy\|test_"; then
            echo "ERROR: Potential hardcoded secrets detected in code."
            exit 1
          fi
          echo "Security scan passed: No obvious hardcoded secrets found."

  # Final job: summary
  ci-summary:
    name: CI Summary
    needs: [engine-lint, engine-typecheck, engine-test, dashboard-build, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI results
        run: |
          if [[ "${{ needs.engine-lint.result }}" != "success" || \
                "${{ needs.engine-typecheck.result }}" != "success" || \
                "${{ needs.engine-test.result }}" != "success" || \
                "${{ needs.dashboard-build.result }}" != "success" || \
                "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "⚠️  Some CI checks failed. Please review the logs above."
            exit 1
          fi
          echo "✓ All CI checks passed!"
