name: JARVIS TRADER CI

# 1. Global permissions for the workflow token
permissions:
  contents: read

# 2. Workflow triggers
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# 3. Concurrency management
concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 4. Jobs definition
jobs:
  engine-lint:
    name: Engine Lint (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install ruff
        run: pip install ruff==0.8.0

      # Run from engine/ so isort treats agents, config, database, … as first-party
      # (ruff check engine/ from repo root mis-classifies them and fails I001).
      - name: Run ruff check
        run: |
          cd engine
          ruff check . --config ruff.toml

      - name: Run ruff format check
        run: |
          cd engine
          ruff format --check . --config ruff.toml

  engine-typecheck:
    name: Engine Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt
          pip install -q mypy==1.8.0 types-requests

      # Allowlist + --follow-imports=skip for small modules that would otherwise pull the whole app graph.
      - name: Mypy gate (allowlisted clean files)
        run: |
          mypy engine/tests/test_paper_runner_engine_sync.py \
            engine/tests/test_portfolio_paper_trade_post.py \
            engine/routers/validation_router.py \
            engine/execution/paper_trade_logger.py \
            --ignore-missing-imports --config-file engine/pyproject.toml \
            --explicit-package-bases --namespace-packages \
            --follow-imports=skip

      - name: Run mypy type checking
        continue-on-error: true
        run: |
          # Full-tree mypy has legacy debt (300+); keep visible, non-blocking until tightened.
          mypy engine/ --ignore-missing-imports --config-file engine/pyproject.toml \
            --explicit-package-bases --namespace-packages

  # Parallel slices (wall-clock): fast ~unit/router + slow integration/E2E (see pytest.mark.slow).
  engine-test-fast:
    name: Engine Tests (pytest, fast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.fast
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt

      - name: Strategic metrics snapshot script
        run: python scripts/strategic_snapshot.py

      - name: Run pytest (-m "not slow")
        run: |
          pytest engine/tests/ -m "not slow" \
            -v --tb=short --cov=engine --cov-report=term-missing

      - name: Upload coverage data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-fast
          path: .coverage.fast
          include-hidden-files: true
          retention-days: 7

  engine-test-slow:
    name: Engine Tests (pytest, slow)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.slow
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install dependencies
        run: |
          pip install -q -r engine/requirements-core.txt

      - name: Run pytest (-m slow)
        run: |
          pytest engine/tests/ -m slow \
            -v --tb=short --cov=engine --cov-report=term-missing \
            || { ec=$?; if [[ $ec -eq 5 ]]; then echo "No slow tests collected; skipping slow slice"; exit 0; fi; exit "$ec"; }

      - name: Upload coverage data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-slow
          path: .coverage.slow
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  engine-coverage-merge:
    name: Engine Tests (coverage merge)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [engine-test-fast, engine-test-slow]
    if: ${{ needs.engine-test-fast.result == 'success' && needs.engine-test-slow.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements-core.txt'

      - name: Install coverage
        run: pip install -q -r engine/requirements-core.txt

      - name: Download fast coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-fast
          path: cov-fast

      - name: Download slow coverage data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-slow
          path: cov-slow

      - name: Combine and emit coverage.xml
        run: |
          cd "${GITHUB_WORKSPACE}"
          # upload-artifact preserves filename under the given directory
          FAST=$(find cov-fast -type f | head -1)
          SLOW=""
          if [[ -d cov-slow ]]; then SLOW=$(find cov-slow -type f | head -1); fi
          if [[ -z "${FAST}" ]]; then echo "ERROR: missing fast coverage after download"; ls -laR cov-fast || true; exit 1; fi
          if [[ -n "${SLOW}" ]]; then
            coverage combine --rcfile=engine/pyproject.toml "${FAST}" "${SLOW}"
          else
            echo "No slow coverage file; using fast slice only"
            cp "${FAST}" .coverage
          fi
          coverage xml -o coverage.xml --rcfile=engine/pyproject.toml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  dashboard-build:
    name: Dashboard Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      - name: Build Next.js
        run: pnpm run build
        working-directory: dashboard
        env:
          NODE_ENV: production

      - name: No bare await fetch in dashboard app/hooks
        run: |
          set -euo pipefail
          HITS=$(grep -r "await fetch(" dashboard/app dashboard/hooks \
            --include="*.tsx" --include="*.ts" 2>/dev/null || true)
          if [[ -n "${HITS}" ]]; then
            echo "${HITS}"
            echo "ERROR: Use fetchEngine/postEngine from dashboard/lib/api.ts instead of bare fetch."
            exit 1
          fi
          echo "OK: no bare await fetch in dashboard/app or dashboard/hooks."

      - name: No bare await fetch in dashboard components
        run: |
          set -euo pipefail
          HITS=$(grep -r "await fetch(" dashboard/components \
            --include="*.tsx" --include="*.ts" 2>/dev/null || true)
          if [[ -n "${HITS}" ]]; then
            echo "${HITS}"
            echo "ERROR: Use fetchEngine/postEngine/fetchEngineRaw from dashboard/lib/api.ts instead of bare fetch."
            exit 1
          fi
          echo "OK: no bare await fetch in dashboard/components."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for .env files
        run: |
          if find . -name '.env' -o -name '.env.local' -o -name '.env.*.local' | grep -v '.env.example' | grep -v 'node_modules'; then
            echo "ERROR: Untracked .env files found. These should never be committed."
            exit 1
          fi

      - name: Check for hardcoded secrets
        run: |
          set -euo pipefail
          # Raw key material only — avoids false positives on settings.ANTHROPIC_API_KEY, risk_*, etc.
          HITS=$(grep -rE "sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}|sk_live_[0-9a-zA-Z]{20,}|xox[baprs]-[0-9a-z-]{10,}|AKIA[0-9A-Z]{16}" \
            --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.next \
            engine/ dashboard/ 2>/dev/null || true)
          if [[ -n "${HITS}" ]]; then
            echo "${HITS}"
            echo "ERROR: Potential raw API keys detected in repository."
            exit 1
          fi
          echo "Security scan passed: no high-signal secret patterns matched."

  ci-summary:
    name: CI Summary
    needs:
      - engine-lint
      - engine-typecheck
      - engine-test-fast
      - engine-test-slow
      - engine-coverage-merge
      - dashboard-build
      - security-scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI results
        run: |
          if [[ "${{ needs.engine-lint.result }}" != "success" || \
                "${{ needs.engine-typecheck.result }}" != "success" || \
                "${{ needs.engine-test-fast.result }}" != "success" || \
                "${{ needs.engine-test-slow.result }}" != "success" || \
                "${{ needs.dashboard-build.result }}" != "success" || \
                "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "⚠️  Some CI checks failed. Please review the logs above."
            exit 1
          fi
          if [[ "${{ needs.engine-test-fast.result }}" == "success" && \
                "${{ needs.engine-test-slow.result }}" == "success" && \
                "${{ needs.engine-coverage-merge.result }}" != "success" ]]; then
            echo "⚠️  Coverage merge failed while both pytest slices passed."
            exit 1
          fi
          echo "✓ All CI checks passed!"