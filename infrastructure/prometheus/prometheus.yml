# Prometheus Configuration for JARVIS TRADER
# Scrapes metrics from FastAPI /metrics endpoint and Prometheus itself

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "jarvis_trader"

scrape_configs:
  # ── JARVIS TRADER Engine ──────────────────────────────────────────────
  - job_name: "jarvis_trader_engine"
    static_configs:
      - targets: ["host.docker.internal:8010"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # ── Prometheus Self-Monitoring ────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
