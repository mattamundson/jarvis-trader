# JARVIS TRADER — Paper Trading Overrides
# Compose file override for paper trading mode
# Usage: docker compose -f docker-compose.yml -f docker-compose.paper.yml up -d
#
# This file:
# - Reduces resource limits for paper trading (doesn't need as much memory/CPU)
# - Sets environment variables for paper mode safety
# - Overrides container resource constraints

services:

  # PostgreSQL — Tighter resource limits for paper mode
  postgres:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    environment:
      POSTGRES_INITDB_ARGS: "-c shared_buffers=128MB -c max_connections=50"

  # Redis — Reduced memory for paper trading
  redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel warning

  # QuestDB — Minimal config for paper trading
  questdb:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Prometheus — Lighter scrape interval for paper testing
  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--query.max-concurrency=8"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Grafana — Minimal for paper trading
  grafana:
    environment:
      GF_PANELS_PLUGIN_ADMINS_ENABLED: "true"
      GF_SECURITY_ALLOW_EMBED_DASHBOARDS: "true"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
