[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-trader"
version = "0.1.0"
description = "JARVIS TRADER — Multi-Agent Trading System with Hard Safety Controls"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Matt", email = "trader@jarvis.local"}
]
license = {text = "Proprietary"}

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=5.0.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
    # 'manual' tests need a live IB Gateway and hang the asyncio loop (no timeout
    # can interrupt the tick subscription), so exclude them by default. Opt back
    # in explicitly with `pytest -m manual` (a CLI -m overrides this addopts -m).
    # 'integration_ib' tests only self-skip when Gateway is unreachable -- when
    # the paper Gateway is up (the normal state while trading), they connect for
    # real and submit real paper orders (2026-08-11: an ordinary `pytest tests/`
    # run placed live BUY 1 MES/MCL/MNQ orders this way). Excluded by default for
    # the same reason as 'manual'; opt in explicitly with `pytest -m integration_ib`.
    "-m", "not manual and not integration_ib",
]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "integration_ib: needs IB Gateway on paper port 4002 -- submits REAL paper orders against it when reachable; only skips when Gateway is down. Never collected by default (see addopts); opt in explicitly with `pytest -m integration_ib`.",
    "manual: opt-in tests that require external setup (e.g. IB Gateway running); never collected in CI",
    "unit: marks tests as unit tests",
    "smoke: marks tests as smoke tests",
]
timeout = 30
log_cli = false
log_cli_level = "INFO"
log_file = "pytest.log"
log_file_level = "DEBUG"

[tool.mypy]
# Type checking configuration — baseline mode (provisioned 2026-05-07)
# See ~/.claude/handoffs/MYPY_BASELINE_2026-05-07.md for triage + cleanup roadmap.
# NOT a hard CI gate yet — visibility-only. Errors surface on `mypy engine/`.
python_version = "3.12"

# External deps lack stubs in this venv (ib_insync, freqtrade, polygon, kraken, etc.)
ignore_missing_imports = true

# Hygiene knobs — flag stale # type: ignore + dead casts.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_return_any = true
warn_no_return = true

# Catches comparing incompatible types (e.g. `if x == "true"` when x: bool).
strict_equality = true

# Show error codes so we can suppress specific errors with `# type: ignore[code]`.
show_error_codes = true

# __init__.py re-exports are common in this codebase.
no_implicit_reexport = false

# Type-check function bodies even when signature is untyped (gradual adoption).
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

# NOT enabling these initially — would explode the baseline.
# Re-enable per-module once that module is clean:
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Engine is a namespace dir (no engine/__init__.py). Set the package base to
# engine/ so submodules resolve as `llm.client` not `engine.llm.client`. This
# matches the runtime convention (uvicorn cwd=engine/) and avoids the
# "Source file found twice under different module names" error.
mypy_path = "engine"
explicit_package_bases = true
namespace_packages = true

# Exclude patterns — venv + build dirs + experimental sandbox + tests.
# `exclude` is a single regex matched against module paths (cwd-relative).
# We run mypy from engine/ so paths look like `tests/foo.py` not `engine/tests/foo.py`.
exclude = '''(?x)(
    /\.venv/
    | ^\.venv/
    | ^venv/
    | ^build/
    | ^dist/
    | /\.git/
    | ^learning/_experimental/    # WIP code, not part of runtime path
    | ^tests/                     # tests excluded from baseline (1500+ noise errors)
    | /test_[^/]+\.py$            # ad-hoc test harness scripts anywhere
    | ^strategies/generated/      # auto-generated strategy code
    | ^\.tmp/                     # local mypy log dir
)'''

# Run mypy from engine/ directory; explicit list lets us exclude tests cleanly.
files = ["."]

# Plugin configuration
plugins = []

# Per-module overrides — modules with inherited type debt that we explicitly
# defer to the cleanup roadmap. Removing an entry here means the module is
# expected to type-check cleanly. See MYPY_BASELINE_2026-05-07.md for context.
# (Populated after the baseline run — currently empty, all errors visible.)

[tool.isort]
# Import sorting
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]
known_first_party = ["engine", "agents", "risk", "backtest", "execution"]

[tool.black]
# Code formatting
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
# Linting
target-version = "py310"
line-length = 100
# Never lint discarded LLM-generated strategy dumps: they are saved verbatim
# (markdown code fences included), so they are not valid Python and produce
# spurious syntax-errors + undefined-name cascades. They are not source.
extend-exclude = [
    "strategies/.trash",
    "**/.trash",
    # Experimental per-strategy backtest run-scripts (run_<sym>_<strat>_rank<N>.py):
    # one-off research drivers with late sys.path/noqa imports ruff can't resolve
    # (~500 F821). Not production engine code; core backtest modules stay linted.
    "backtest/run_*.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "C901",  # complexity - legacy, ignored for now
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "F401",  # unused imports in tests
    "F841",  # unused variables in tests
    "E402",  # module level import not at top of file in tests
]
"**/test_*.py" = [
    "F401",  # unused imports in tests
    "F841",  # unused variables in tests
    "E402",  # module level import not at top of file in tests
]
"**/conftest.py" = [
    "F401",  # pytest fixtures are often unused in the file they're defined
    "E402",  # conftest can have imports mid-file
]
"main.py" = [
    "I001",  # import block unsorted — 4100-line file with sprints of appended router imports
    "E402",  # late websocket imports are intentional (circular import avoidance)
]
"scripts/port_guardian.py" = [
    "E402",  # real imports deliberately follow the foreign-PYTHONHOME guard so the
             # guard can fail fast before any stdlib import triggers the SRE
             # module-mismatch crash (see the file's module docstring)
]
"analytics/performance_evaluator.py" = [
    "I001",  # conditional try/except presence-check import; isort grouping differs
             # irreconcilably between ruff 0.8.0 (CI) and 0.15.12 (local pre-commit)
]
"backtest/backtester.py" = [
    "B023",  # false positive: nested functions in loops used as closures
]

[tool.coverage.run]
# Test coverage
source = ["engine"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# PRB-17: coverage.xml was generated and uploaded as a CI artifact but nothing
# gated on it -- a PR could drop coverage to 0% and CI would still pass, since
# `coverage xml`/`coverage report` only fail on a non-zero fail_under. Baseline
# measured 2026-07-30 against the latest green origin/master run (6856c4c,
# https://github.com/mattamundson/jarvis-trader/actions/runs/30479806744):
# 64.74% total line coverage (184275 lines valid, 119294 covered). Floor set a
# few points below that baseline so ordinary coverage drift across unrelated
# files doesn't false-positive a PR, while still catching a real regression
# (e.g. a PR that guts test coverage or approaches 0%). Applies to `coverage
# report`, `coverage html`, `coverage xml`, and `coverage json` alike -- raise
# this over time as real coverage improves; never lower it without a
# documented reason.
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]