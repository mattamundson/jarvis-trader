[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-trader"
version = "0.1.0"
description = "JARVIS TRADER — Multi-Agent Trading System with Hard Safety Controls"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Matt", email = "trader@jarvis.local"}
]
license = {text = "Proprietary"}

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=5.0.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "smoke: marks tests as smoke tests",
]
timeout = 30
log_cli = false
log_cli_level = "INFO"
log_file = "pytest.log"
log_file_level = "DEBUG"

[tool.mypy]
# Type checking configuration
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true

# Exclude patterns
exclude = [".venv", "venv", "build", "dist", ".git"]

# Plugin configuration
plugins = []

[tool.isort]
# Import sorting
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]
known_first_party = ["engine", "agents", "risk", "backtest", "execution"]

[tool.black]
# Code formatting
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
# Linting
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "C901",  # complexity - legacy, ignored for now
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "F401",  # unused imports in tests
    "F841",  # unused variables in tests
    "E402",  # module level import not at top of file in tests
]
"**/test_*.py" = [
    "F401",  # unused imports in tests
    "F841",  # unused variables in tests
    "E402",  # module level import not at top of file in tests
]
"**/conftest.py" = [
    "F401",  # pytest fixtures are often unused in the file they're defined
    "E402",  # conftest can have imports mid-file
]
"backtest/backtester.py" = [
    "B023",  # false positive: nested functions in loops used as closures
]

[tool.coverage.run]
# Test coverage
source = ["engine"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
